name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
      runner:
        description: >-
          Runner label: macos-15-intel (GitHub) or xnu-mac (self-hosted Mi Air Mac,
          incremental build). Empty = repo variable XNU_RUNNER, else macos-15-intel
        default: ""
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}

jobs:
  build:
    # macos-14 runners are gone (2026); macos-15 ships Xcode 16, whose iig needs
    # IORPC.kernelContent: added to xnu-8796 by patch 0084
    # The kernel target is ARM64 either way (build.sh ARCH_CONFIG); an Intel
    # host just cross-compiles. arm64 runners frequently time out in the queue.
    # Self-hosted (label xnu-mac): tools/xnu-build-local.sh in a persistent work
    # dir, so only changed files are recompiled; no Homebrew/sudo needed there.
    runs-on: ${{ inputs.runner || vars.XNU_RUNNER || 'macos-15-intel' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        if: runner.environment == 'github-hosted'
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          # OnePlus 3: the arm64 slice of libfirehose_kernel must be ARMv8.0 as well
          # (Apple clang otherwise targets apple-m1: LSE atomics + LDAPR)
          python3 - <<'PY'
          p = 'dxb/build.sh'
          s = open(p, encoding='utf-8').read()
          # insert after the last xcconfig sed (before the cd/env/xcodebuild continuation)
          anchor = "s|$(SDKROOT)/usr/local/include|$(FAKEROOT_DIR)/usr/local/include|g' \"${SRCROOT}/xcodeconfig/libfirehose_kernel.xcconfig\"\n"
          i = s.index(anchor) + len(anchor)
          ls = s.rindex('\n', 0, i - 1) + 1
          indent = s[ls:len(s[:ls]) + (len(s[ls:]) - len(s[ls:].lstrip(' ')))]
          line = indent + "printf '\\nOTHER_CFLAGS[arch=arm64] = $(inherited) -mcpu=cortex-a57\\n' >> \"${SRCROOT}/xcodeconfig/libfirehose_kernel.xcconfig\"\n"
          open(p, 'w', encoding='utf-8').write(s[:i] + line + s[i:])
          PY
          grep -n 'mcpu=cortex-a57' dxb/build.sh
          ls dxb/patches

      - name: Deps
        if: runner.environment == 'github-hosted'
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        if: runner.environment == 'github-hosted'
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Build (self-hosted Mac, incremental)
        if: runner.environment == 'self-hosted'
        env:
          KEEP_GOING: ${{ inputs.keep_going || 'true' }}
        run: |
          export XNU_WORK="$HOME/xnu-work-ci"
          args="--auto-reset"
          [ "$KEEP_GOING" = false ] || args="$args --keep-going"
          sw_vers; xcodebuild -version
          set +e
          bash tools/xnu-build-local.sh $args
          rc=$?
          # the packaging/collect steps below expect the build script tree at ./dxb
          ln -sfn "$XNU_WORK/dxb" dxb
          exit $rc

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C "$GITHUB_WORKSPACE" sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
